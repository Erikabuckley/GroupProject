<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/dashStyle.css">
    <script type="module" src="../scripts/template.js" defer></script>
    <script type="text/javascript" src="../scripts/dashUtil.js" defer></script>

    <title>Dashboard</title>
</head>

<body>
    <div id="backdrop"></div>
    <div class="header-container"></div>

    <div style="padding:2rem">

        <h1>Reduce your emissions today! </h1><br>
        <input type="button" id="upload" value="Submit action" class="in-button">

        <div id="upload-modal" class="modal">
            <div class="modal-content">
                <span class="close" id="close-upload">&times;</span>
                <h2>Upload submission: </h2>
                <form class="form" id="evidanceForm">
                    <span id="error" class="error"></span>
                    <label for="mission-input">What mission is your action for?</label>
                    <select required name="Mission" id="mission-input">
                        <option value="" selected disabled hidden>Select a mission</option>
                    </select><br>
                    <label for="quantity-input">How many did you complete?</label>
                    <input type="number" id="quantity-input" required
                        placeholder="Enter the number of times you did this action" min="1"><br>
                    <label for="challenge-input">Is your mission part of a challenge?</label>
                    <select required name="Challenge" id="challenge-input">
                        <option value="" selected disabled hidden>Select a challenge</option>
                        <option value="No">No</option>
                    </select><br>
                    <label for="group-challenge-input">Which group is your challenge submission for?</label>
                    <select required name="Group" id="group-challenge-input">
                        <option value="" selected disabled hidden>Select an group</option>
                        <option value="None">None</option>
                    </select><br>
                    <label for="upload-input">Please upload evidence for the challenge sumission if required:</label>
                    <input type="file" name="upload" id="upload-input"
                        accept=".jpg, .jpeg, .png"><br>
                    <div class="declaration">
                        <input required type="checkbox" id="declaration" name="declaration">
                        <label for="declaration"> Any evidance uploaded does not contain sensitive informaton</label>
                    </div>
                    <input type="submit" value="Confirm" name="confirm" id="confirm" class="in-button">
                </form>
            </div>
        </div>

        <script>
            var s_modal = document.getElementById("upload-modal");
            var s_btn = document.getElementById("upload");
            var s_span = document.getElementById("close-upload");
            var backdrop = document.getElementById("backdrop");

            s_btn.onclick = function () {
                s_modal.style.display = "block";
                backdrop.style.display = "block";
            };
            s_span.onclick = function () {
                s_modal.style.display = "none";
                backdrop.style.display = "none";
            };
            
            backdrop.addEventListener('click', function  () {
                s_modal.style.display = "none";
                backdrop.style.display = "none";
            });
        </script>

        <h1>Play with friends</h1><br>
        <input type="button" id="join" value="Join a group" class="in-button">

        <div id="join-modal" class="modal">
            <div class="modal-content">
                <span class="close" id="close-join">&times;</span>
                <h2>Join a group:</h2>
                <span class="error" id="error-message">Already in group</span>
                <form class="form" id="joinForm">
                    <label for="group-input">What group would you like to join?</label>
                    <select required name="Group" id="group-input" value="Select the group you would like ot join:">
                        <option value="" selected disabled hidden>Select an Option</option>
                    </select><br>
                    <input type="submit" value="Confirm" name="confirm" id="confirm" class="in-button">
                </form>
            </div>
        </div>

        <script>
            var j_modal = document.getElementById("join-modal");
            var j_span = document.getElementById("close-join");
            var j_btn = document.getElementById("join");
            var backdrop = document.getElementById("backdrop");

            j_btn.onclick = function () {
                j_modal.style.display = "block";
                backdrop.style.display = "block";
            };
            j_span.onclick = function () {
                j_modal.style.display = "none";
                backdrop.style.display = "none";
            };
            
            backdrop.addEventListener('click', function  () {
                j_modal.style.display = "none";
                backdrop.style.display = "none";
            });
        </script>
    </div>

    <div id="data-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-data">&times;</span>
            <h2>Your action saved carbon well done!</h2>
            <p>You saved:</p>
            <p id="amount"></p>
            <a id="source" href="#"></a>
        </div>
    </div>

    <script>
        var d_modal = document.getElementById("data-modal");
        var d_span = document.getElementById("close-data");
            var backdrop = document.getElementById("backdrop");

            d_span.onclick = function () {
                d_modal.style.display = "none";
                backdrop.style.display = "none";
            };
            
            backdrop.addEventListener('click', function  () {
                d_modal.style.display = "none";
                backdrop.style.display = "none";
            });
    </script>

    <div class="total">
        <h1>Total Carbon Saved To-date</h1>
        <p id="indi-carbon"></p>
    </div>

    <div class="total">
        <h1>Total Points Earned  To-date</h1>
        <p id="indi-points"></p>
    </div>

    <div id="log history">
        <h1>Challenge submission history:</h1>
        <div id="log"></div>
    </div>

    <div class="footer-container"></div>
</body>

</html>
