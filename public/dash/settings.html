<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/dashStyle.css">
    <script type="module" src="../scripts/template.js"></script>
    <script type="text/javascript" src="../scripts/settingsUtil.js" defer></script>

    <title>Settings</title>
</head>

<body>
    <div class="header-container"></div>
    <!--Form allows user to delete their account-->
    <section class="indent spacer">
        <h2>Click here to delete your account</h2>
        <button type="button" class="in-button" id="delete-account">Delete</button>
        <dialog id="delete" class="dialog">
            <div class="dialog-content">
                <label for="password">Please type "delete" to delete your password</label><br>
                <span class="error" id="delete-error"></span><br>
                <input type="text" required id="password" placeholder="delete"><br>
                <div class="button-row">
                    <button type="button" id="close" class="second-button">Close</button>
                    <button type="button" id="confirm" class="in-button">Confirm</button><br>
                </div>
            </div>
        </dialog>
        <h4 class="facts">Don't go - Global temperatures are rising!! The Earth's average temperature has increased by
            about 1.2°C since the late 19th century</h4>
    </section>

    <div class="footer-container"></div>
</body>

</html>
