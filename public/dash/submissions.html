<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/dashStyle.css">
    <link rel="stylesheet" href="../styles/submissionsStyle.css">
    <script type="module" src="../scripts/template.js" defer></script>
    <script type="text/javascript" src="../scripts/submissionsUtil.js" defer></script>
    <script type="module" src="../scripts/modCheck.js" defer></script>

    <title>Submissions</title>
</head>

<body>
    <div id="backdrop"></div>
    <div class="header-container"></div>
    <div class="indent">
        <h1> Challenges to approve: </h1>
        <div id="submissions-container"></div>
    </div>

    <div id="approveDeny-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-approveDeny">&times;</span>
            <h2>Is this submission acceptable:</h2>
            <p>View unacceptable criteria <a href="../policies/submissions.html">here</a></p>
            <span class="error" id="approval-error"></span>
            <form class="form" id="approveDenyForm">
                <label for="approve">Approve</label>
                <input type="radio" name="val" value="approve" id="approve" required>
                <label for="approve">Deny</label>
                <input type="radio" name="val" value="deny" id="deny" required><br>
                <label for="reason-input">Please provide a reason</label><br>
                <textarea required id="reason-input"></textarea><br>
                <input  type="checkbox" id="identifying-info" name="identifying-info">
                <label for="identifying-info"> This submission contains identifying information</label><br>
                <input type="submit" value="Submit" name="confirm" id="approveDeny-submit" class="in-button">
            </form>
        </div>
    </div>

    <script>
        var a_modal = document.getElementById("approveDeny-modal");
        var a_span = document.getElementById("close-approveDeny");
        var backdrop = document.getElementById("backdrop");

        a_span.onclick = function () {
            a_modal.style.display = "none";
            backdrop.style.display = "none";
        };           
    </script>

    <div class="footer-container"></div>
</body>

</html>
