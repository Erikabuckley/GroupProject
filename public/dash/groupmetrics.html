<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/dashStyle.css">
    <link rel="stylesheet" href="../styles/metricStyle.css">
    <script type="module" src="../scripts/template.js" defer></script>
    <script type="text/javascript" src="../scripts/groupUtil.js" defer></script>

    <link rel="stylesheet" href="https://pyscript.net/releases/2023.11.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2023.11.1/core.js"></script>

    <py-config> packages = ["numpy", "matplotlib"] </py-config>

    <title>Metrics</title>
</head>

<body>
    <div class="header-container"></div>
    <div>
        <h1> Group Metrics </h1>
        <div class="key-stats">
            <div class="total">
                <h2>Total Carbon Saved:</h2>
                <p id="group-carbon"></p>
            </div>

            <div class="total">
                <h2>Total Points Earned:</h2>
                <p id="group-points"></p>
            </div>
        </div>

        <py-script>
        <!-- Insert Python code to show graph -->
        <!-- display(fig, target="show-graph1", append=False) -->
        </py-script>

        <div class="graph-block">
            <div class="graph" id="graph1">
                <h1> Carbon Saved Overtime </h1>
            </div>
            <div class="graph" id="graph2">
                <h1> Points Earned Overtime </h1>
            </div>
        </div>

        <div class="filters">
            <button type="button" class="in-button" id="filter-one">My Contributions</button>
            <button type="button" class="in-button" id="filter-two">Sort By: Date Submitted</button>
            <button type="button" class="in-button" id="filter-three">Sort By: Action Type</button>
        </div>

        <div class="table">
            <h1>
                Table
            </h1>

            </table>
        </div>

    <div class="footer-container"></div>
